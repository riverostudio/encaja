name: Calidad diaria

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  catalogo-y-fuentes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/crear-db-ci.ts
      - run: npm test
      - run: npm run test:quality
      - run: npm run test:links
